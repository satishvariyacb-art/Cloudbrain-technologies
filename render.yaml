services:
  - type: web
    name: cloudbrain-web
    runtime: static
    rootDir: web
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: VITE_API_URL
        sync: false
